# =============================================================================
# Mekong Mobile Smart CRM - Luồng L4 (Phân công KTV & Lịch hẹn)
# Đóng gói tái lập được: `cp .env.example .env && docker compose up -d --build`
# =============================================================================

services:
  # ---------- CSDL PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: mekong_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mekong_crm_l4}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mekong_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mekong_crm_l4}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Backend REST API (URL: http://localhost:3000) ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mekong_crm_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      API_PREFIX: ${API_PREFIX:-/api}
      # TÊN DỊCH VỤ của CSDL trong mạng nội bộ Docker, KHÔNG phải localhost
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-mekong_crm_l4}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_mekong_mobile_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  # ---------- Frontend Web UI (URL: http://localhost:5173) ----------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    container_name: mekong_crm_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  mekong_pgdata:
