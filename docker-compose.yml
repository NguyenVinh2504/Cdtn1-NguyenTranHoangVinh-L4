version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mekong_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mekong_crm_l4}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mekong_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dịch vụ Backend REST API (URL: http://localhost:3000)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mekong_crm_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-mekong_crm_l4}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_mekong_mobile_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"

  # Dịch vụ Frontend Web UI (URL: http://localhost:5173)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:3000}
    container_name: mekong_crm_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  mekong_pgdata:
